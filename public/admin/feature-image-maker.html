<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog Feature Image Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#0b2a3d;--mute:#4d6a7c;--line:#cfe0ea;--brand:#075b8f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a24;--card:#10293a;--ink:#e6f1f7;--mute:#9db7c6;--line:#24435a;--brand:#4aa8dc;--on:#06202f}}
:root[data-theme="dark"]{--bg:#0a1a24;--card:#10293a;--ink:#e6f1f7;--mute:#9db7c6;--line:#24435a;--brand:#4aa8dc;--on:#06202f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:6px}
textarea,input[type=file],input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{resize:vertical;min-height:80px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g label{font-weight:500;font-size:.9rem;margin-bottom:2px}
@media(max-width:560px){.g{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;background:var(--brand);color:var(--on);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:10px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
canvas,#out{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block}
#meta{color:var(--mute);margin:8px 0 0;font-size:.95rem}
#useInBlog{background:#15803d}
#dl{margin-right:6px}
</style>
</head>
<body>
<main>
<h1>ব্লগ Feature Image Maker</h1>
<p class="sub">নিজের ছবি ও ব্লগের শিরোনাম দিয়ে ১২০০×৬৩০ ফিচার ইমেজ বানান। তৈরি হলে সরাসরি Blog Form-এ পাঠাতে পারবেন।</p>

<div class="card">
  <label for="photo">১. ডাক্তারের ছবি বেছে নিন (JPG / PNG / WEBP)</label>
  <input id="photo" type="file" accept="image/*">
  <label for="title" style="margin-top:14px">২. ইমেজের টাইটেল</label>
  <textarea id="title">শিশুর হাইড্রোসিল: লক্ষণ, কারণ, চিকিৎসা ও অপারেশন কখন দরকার হয়?</textarea>
  <label style="margin-top:14px">৩. বাকি লেখা (ডিফল্ট দেওয়া আছে, ইচ্ছে হলে বদলান)</label>
  <div class="g">
    <div><label for="cat">ক্যাটাগরি চিপ (খালি রাখলে বাদ যাবে)</label><input id="cat" type="text" value="শিশু সার্জারি"></div>
    <div><label for="docname">ডাক্তারের নাম</label><input id="docname" type="text" value="ডা. অমিত হাসান"></div>
    <div><label for="role">পরিচয় / ডিগ্রি</label><input id="role" type="text" value="শিশু ও নবজাতক সার্জন · MBBS, MS (শিশু সার্জারি)"></div>
    <div><label for="serial">সিরিয়াল লাইন</label><input id="serial" type="text" value="সিরিয়াল: 01640-167617"></div>
    <div><label for="site">ওয়েবসাইট</label><input id="site" type="text" value="dramithasan.com"></div>
  </div>
  <button id="go" type="button">ইমেজ তৈরি করুন</button>
</div>

<div class="card">
  <canvas id="cv" width="1200" height="630" aria-label="Feature image preview"></canvas>
</div>

<div class="card">
  <label>৪. ইমেজ সেভ করুন</label>
  <p class="sub" style="margin-bottom:10px">নিচের বাটনে চাপ দিয়ে ডাউনলোড করুন। বাটন কাজ না করলে ছবির ওপর right-click (মোবাইলে চেপে ধরে) করে "Save image" দিন।</p>
  <img id="out" alt="শিশুর হাইড্রোসিল নিয়ে শিশু সার্জন ডা. অমিত হাসানের পরামর্শ" width="1200" height="630">
  <p id="meta"></p>
  <button id="dl" type="button" hidden>⬇ ইমেজ ডাউনলোড করুন (WEBP)</button>
  <button id="useInBlog" type="button" hidden>✓ এই ছবিটি ব্লগে ব্যবহার করুন</button>
  <p id="dlmsg" role="status" style="color:var(--mute);margin:8px 0 0"></p>
</div>
</main>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  var W=1200,H=630,photo=null,F='"Hind Siliguri",system-ui,sans-serif';

  function wrap(text,maxW,size){
    ctx.font='700 '+size+'px '+F;
    var words=text.split(/\s+/),lines=[],cur='';
    words.forEach(function(w){
      var t=cur?cur+' '+w:w;
      if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t;
    });
    if(cur)lines.push(cur);
    return lines;
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

  function val(id){return document.getElementById(id).value.trim()}
  function fit(text,weight,size,maxW){
    var z=size;
    for(;z>14;z-=1){ctx.font=weight+' '+z+'px '+F;if(ctx.measureText(text).width<=maxW)break}
    return z;
  }
  function draw(){
    var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#052f4a');g.addColorStop(1,'#075b8f');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // photo panel with slanted left edge
    ctx.save();
    ctx.beginPath();ctx.moveTo(800,0);ctx.lineTo(W,0);ctx.lineTo(W,H);ctx.lineTo(720,H);ctx.closePath();ctx.clip();
    ctx.fillStyle='#dcecf6';ctx.fillRect(700,0,500,H);
    if(photo){
      var bx=720,bw=480,bh=H,s=Math.max(bw/photo.width,bh/photo.height);
      var dw=photo.width*s,dh=photo.height*s;
      ctx.drawImage(photo,bx+(bw-dw)/2,0,dw,dh);
    }else{
      ctx.fillStyle='#4d6a7c';ctx.font='700 28px '+F;ctx.textAlign='center';
      ctx.fillText('এখানে আপনার ছবি আসবে',960,H/2);ctx.textAlign='left';
    }
    ctx.restore();
    ctx.strokeStyle='#f4b942';ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(800,0);ctx.lineTo(720,H);ctx.stroke();

    // category chip
    ctx.font='700 26px '+F;
    var cat=val('cat'),cw=ctx.measureText(cat).width+40;
    ctx.textBaseline='middle';
    if(cat){
      ctx.fillStyle='#f4b942';rr(60,52,Math.min(cw,610),48,24);ctx.fill();
      ctx.fillStyle='#052f4a';ctx.fillText(cat,80,77);
    }

    // title, auto-fit
    var t=document.getElementById('title').value.trim()||' ';
    var size=60,lines,maxW=610,maxLines=4;
    for(;size>30;size-=2){lines=wrap(t,maxW,size);if(lines.length<=maxLines&&lines.length*size*1.35<=330)break}
    ctx.fillStyle='#fff';ctx.textBaseline='alphabetic';ctx.font='700 '+size+'px '+F;
    var y=150+size;
    lines.forEach(function(l,i){ctx.fillText(l,60,y+i*size*1.35)});

    // doctor block
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(60,478,610,2);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
    var dn=val('docname'),rl=val('role'),sr=val('serial'),st=val('site');
    ctx.fillStyle='#fff';ctx.font='700 '+fit(dn,'700',34,610)+'px '+F;ctx.fillText(dn,60,527);
    ctx.fillStyle='#cfe6f3';ctx.font='500 '+fit(rl,'500',24,610)+'px '+F;ctx.fillText(rl,60,562);
    ctx.fillStyle='#f4b942';ctx.font='700 '+fit(sr,'700',26,st?360:610)+'px '+F;ctx.fillText(sr,60,602);
    if(st){ctx.fillStyle='#cfe6f3';ctx.font='500 '+fit(st,'500',22,220)+'px '+F;ctx.textAlign='right';ctx.fillText(st,670,602);ctx.textAlign='left';}

    // export, keep under 2MB
    var q=0.9;
    (function enc(){
      cv.toBlob(function(b){
        if(!b){document.getElementById('meta').textContent='এই ব্রাউজারে WEBP ইমেজ তৈরি করা যায়নি। Chrome/Edge-এর আপডেটেড ভার্সনে চেষ্টা করুন।';return;}
        if(b.size>1900000&&q>0.5){q-=0.1;return enc()}
        var img=document.getElementById('out');
        var useInBlogButton=document.getElementById('useInBlog');if(useInBlogButton && window.parent!==window)useInBlogButton.hidden=false;
        if(img.dataset.u)URL.revokeObjectURL(img.dataset.u);
        var u=URL.createObjectURL(b);img.dataset.u=u;img.src=u;window._blob=b;
        document.getElementById('meta').textContent='ফরম্যাট: '+(b.type||'image')+' · সাইজ: '+Math.round(b.size/1024)+' KB (২MB-এর নিচে)';
      },'image/webp',q);
    })();
  }

  // Do not let a slow/blocked remote font request make the tool look frozen.
  var fontReady = Promise.resolve();
  if (document.fonts && document.fonts.load) {
    var fontLoad = Promise.all([
      document.fonts.load('700 40px "Hind Siliguri"', 'শিশু'),
      document.fonts.load('500 24px "Hind Siliguri"', 'শিশু')
    ]).catch(function () {});
    var fontFallback = new Promise(function (resolve) { setTimeout(resolve, 900); });
    fontReady = Promise.race([fontLoad, fontFallback]);
  }
  var renderToken = 0;
  function render(){
    var token = ++renderToken;
    var meta = document.getElementById('meta');
    if (meta) meta.textContent = 'ইমেজ তৈরি হচ্ছে…';
    fontReady.then(function () {
      if (token === renderToken) draw();
    }, function () {
      if (token === renderToken) draw();
    });
  }
  document.getElementById('photo').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){photo=im;render()};im.onerror=function(){document.getElementById('meta').textContent='ছবিটি খোলা যায়নি। JPG, PNG অথবা WEBP ছবি দিন।'};im.src=r.result};
    r.onerror=function(){document.getElementById('meta').textContent='ছবি পড়া যায়নি। আবার নির্বাচন করুন।'};
    r.readAsDataURL(f);
  });
  document.getElementById('go').addEventListener('click',render);
  ['title','cat','docname','role','serial','site'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){clearTimeout(window._t);window._t=setTimeout(render,300)})});
  render();

  // download button (shown only when the viewer supports saving)
  var dl=document.getElementById('dl'),msg=document.getElementById('dlmsg');
  if(window.claude&&claude.use){
    claude.use('downloads').then(function(d){
      if(!d)return;
      dl.hidden=false;
      dl.addEventListener('click',function(){
        if(!window._blob){msg.textContent='ইমেজ এখনো তৈরি হয়নি, একটু অপেক্ষা করুন।';return}
        msg.textContent='';
        d.save({filename:'sishur-hydrocele-dr-amit-hasan.webp',data:window._blob}).then(function(){
          msg.textContent='ইমেজ সেভ হয়েছে।';
        },function(e){
          msg.textContent=(e&&e.code==='declined')?'ডাউনলোড বাতিল করা হয়েছে।':'ডাউনলোড হয়নি। ছবির ওপর right-click / চেপে ধরে "Save image" দিন।';
        });
      });
    },function(){});
  } else {
    // opened as a normal local file: plain browser download
    dl.hidden=false;
    dl.addEventListener('click',function(){
      if(!window._blob){msg.textContent='ইমেজ এখনো তৈরি হয়নি, একটু অপেক্ষা করুন।';return}
      var a=document.createElement('a');
      a.href=URL.createObjectURL(window._blob);
      a.download='sishur-hydrocele-dr-amit-hasan.webp';
      document.body.appendChild(a);a.click();a.remove();
      msg.textContent='ডাউনলোড শুরু হয়েছে।';
    });
  }
  // Receive the current Blog title from the admin form.
  window.addEventListener('message',function(event){
    if(event.origin!==window.location.origin||!event.data)return;
    if(event.data.type==='blog-feature-image-maker:set-title'&&typeof event.data.title==='string'){
      document.getElementById('title').value=event.data.title.slice(0,1000);render();
    }
  });
  // Send the generated WebP back to the same-origin admin form (download still works standalone).
  var useInBlogButton=document.getElementById('useInBlog');
  if(useInBlogButton){
    useInBlogButton.hidden=(window.parent===window);
    useInBlogButton.addEventListener('click',function(){
      if(!window._blob){msg.textContent='আগে ইমেজ তৈরি হওয়া পর্যন্ত অপেক্ষা করুন।';return;}
      var reader=new FileReader();
      reader.onload=function(){
        window.parent.postMessage({type:'blog-feature-image-maker:result',dataUrl:reader.result,filename:'blog-feature-image.webp'},window.location.origin);
        msg.textContent='ছবিটি Blog Add ফর্মে পাঠানো হয়েছে। Modal বন্ধ করে Preview দেখুন।';
      };
      reader.onerror=function(){msg.textContent='ছবি পাঠানো যায়নি। আবার চেষ্টা করুন।';};
      reader.readAsDataURL(window._blob);
    });
  }
})();
</script>
</body>
</html>
